<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen Capture 9:16</title>
<style>
:root{
  --bg:#0b0d10; --fg:#f2f4f7; --muted:#9aa3ae; --accent:#3ddc97; --accent-ink:#04261a;
  --scrim:rgba(5,7,9,.72); --panel:#1a1e24;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.hidden{display:none!important}

/* Frame: sized by JS; the huge shadow darkens everything outside it */
#frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border:2px solid var(--accent);border-radius:6px;box-shadow:0 0 0 100vmax var(--scrim);pointer-events:none}
#frame i{position:absolute;width:22px;height:22px;border:4px solid #fff}
#frame i:nth-child(1){left:-4px;top:-4px;border-right:0;border-bottom:0}
#frame i:nth-child(2){right:-4px;top:-4px;border-left:0;border-bottom:0}
#frame i:nth-child(3){left:-4px;bottom:-4px;border-right:0;border-top:0}
#frame i:nth-child(4){right:-4px;bottom:-4px;border-left:0;border-top:0}
#hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);text-align:center;
  font-size:14px;color:var(--fg);text-shadow:0 1px 4px #000;padding:0 16px}

/* Controls: bottom in portrait, right side in landscape */
.controls{position:absolute;display:flex;align-items:center;justify-content:center;gap:20px;
  left:0;right:0;bottom:0;height:128px;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (orientation:landscape){
  .controls{left:auto;top:0;bottom:0;right:0;width:128px;height:auto;flex-direction:column;
    padding-bottom:0;padding-right:env(safe-area-inset-right,0px)}
}
button{font:inherit;color:var(--fg);border:0;cursor:pointer;min-height:56px}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.shutter{width:76px;height:76px;min-height:0;border-radius:50%;background:#fff;
  border:5px solid var(--bg);box-shadow:0 0 0 4px #fff;transition:transform .1s}
.shutter:active{transform:scale(.92)}
.round{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);font-size:22px;line-height:1}
.btn{padding:0 26px;border-radius:28px;font-weight:600;font-size:17px;background:rgba(255,255,255,.14)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}

/* Preview */
#preview{position:absolute;inset:0;background:var(--bg)}
#photo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  max-width:calc(100% - 32px);max-height:calc(100% - 160px);border-radius:6px;background:#000;
  box-shadow:0 0 0 1px rgba(255,255,255,.15)}
@media (orientation:landscape){#photo{max-width:calc(100% - 176px);max-height:calc(100% - 32px)}}
#info{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);text-align:center;color:var(--muted);font-size:13px}

/* Start / error screen */
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:24px;text-align:center;background:var(--bg);z-index:5}
#start h1{margin:0;font-size:26px;letter-spacing:-.01em}
#start p{margin:0;max-width:34ch;color:var(--muted);line-height:1.5}
#start .btn{min-height:60px;font-size:18px;padding:0 34px}
#err{color:#ff8a80!important}
</style>
</head>
<body>
<div id="app">
  <div id="start">
    <h1>Capture a 9:16 screen</h1>
    <p>Point the rear camera at the app screen, line it up inside the frame, and save only the framed area as a JPG.</p>
    <p id="err" class="hidden" role="alert"></p>
    <button id="open" class="btn primary">Open camera</button>
  </div>

  <video id="video" playsinline muted autoplay></video>
  <div id="frame" class="hidden"><i></i><i></i><i></i><i></i></div>
  <div id="hint" class="hidden">Fit the app screen inside the frame</div>
  <div class="controls hidden" id="camControls">
    <button class="round" id="flip" aria-label="Switch camera">&#8635;</button>
    <button class="shutter" id="capture" aria-label="Capture photo"></button>
    <span class="round" style="visibility:hidden" aria-hidden="true"></span>
  </div>

  <div id="preview" class="hidden">
    <div id="info"></div>
    <img id="photo" alt="Captured photo preview">
    <div class="controls">
      <button class="btn" id="retake">Retake</button>
      <button class="btn primary" id="save">Save JPG</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var video=$('video'), frame=$('frame'), start=$('start'), err=$('err');
  var camControls=$('camControls'), hint=$('hint'), preview=$('preview'), photo=$('photo');
  var stream=null, facing='environment', blob=null, blobUrl=null;
  var RATIO = 9/16;           // frame width / height
  var EXPORT_MAX_H = 2560;    // cap export height to keep files reasonable

  function show(el,on){el.classList.toggle('hidden',!on)}
  function fail(msg){err.textContent=msg;show(err,true);show(start,true)}

  // Size the 9:16 frame to fit the visible area (leaves room for the controls)
  function layout(){
    var w=window.innerWidth, h=window.innerHeight;
    var land = w>h, pad=16;
    var availW = land ? w-128-pad*2 : w-pad*2;
    var availH = land ? h-pad*2 : h-128-pad*2-24;
    var fh = Math.min(availH, availW/RATIO), fw = fh*RATIO;
    frame.style.width=fw+'px'; frame.style.height=fh+'px';
    // keep the frame centred in the free area (shift away from controls)
    var cx = land ? (w-128)/2 : w/2, cy = land ? h/2 : (h-128)/2+12;
    frame.style.left=cx+'px'; frame.style.top=cy+'px';
  }
  window.addEventListener('resize',layout);
  window.addEventListener('orientationchange',function(){setTimeout(layout,250)});

  function stop(){
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    video.srcObject=null;
  }

  async function openCamera(){
    show(err,false);
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      return fail('Camera needs a secure (HTTPS) page in a browser that supports it. Open this page over HTTPS in Chrome or Safari.');
    }
    stop();
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}}
      });
    }catch(e){
      var m = (e&&e.name==='NotAllowedError') ? 'Camera permission was blocked. Allow camera access in your browser settings, then try again.'
            : (e&&e.name==='NotFoundError') ? 'No camera was found on this device.'
            : 'Could not start the camera. Close other apps using it and try again.';
      return fail(m);
    }
    video.srcObject=stream;
    try{await video.play()}catch(_){}
    show(start,false); show(frame,true); show(hint,true); show(camControls,true);
    layout();
  }

  // Map the frame rectangle (screen px) to source-pixel coordinates of the video,
  // accounting for object-fit: cover scaling and centring.
  function cropRect(){
    var vw=video.videoWidth, vh=video.videoHeight;
    var r=video.getBoundingClientRect(), f=frame.getBoundingClientRect();
    var scale=Math.max(r.width/vw, r.height/vh);
    var offX=(vw*scale-r.width)/2, offY=(vh*scale-r.height)/2;
    var sx=(f.left-r.left+offX)/scale, sy=(f.top-r.top+offY)/scale;
    var sw=f.width/scale, sh=f.height/scale;
    sx=Math.max(0,sx); sy=Math.max(0,sy);
    sw=Math.min(sw,vw-sx); sh=Math.min(sh,vh-sy);
    return {sx:sx,sy:sy,sw:sw,sh:sh};
  }

  function capture(){
    if(!video.videoWidth) return;
    var c=cropRect();
    var outH=Math.min(Math.round(c.sh),EXPORT_MAX_H);
    var outW=Math.round(outH*RATIO);
    var canvas=document.createElement('canvas');
    canvas.width=outW; canvas.height=outH;
    var ctx=canvas.getContext('2d');
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(video,c.sx,c.sy,c.sw,c.sh,0,0,outW,outH);
    canvas.toBlob(function(b){
      if(!b) return fail('Could not create the image. Try again.');
      if(blobUrl) URL.revokeObjectURL(blobUrl);
      blob=b; blobUrl=URL.createObjectURL(b);
      photo.src=blobUrl;
      $('info').textContent=outW+' \u00d7 '+outH+' px \u00b7 '+(b.size/1024/1024).toFixed(2)+' MB';
      show(preview,true); show(frame,false); show(hint,false); show(camControls,false);
      video.pause();
    },'image/jpeg',0.95);
  }

  function retake(){
    show(preview,false); show(frame,true); show(hint,true); show(camControls,true);
    if(!stream) openCamera(); else video.play().catch(function(){});
  }

  function pad(n){return String(n).padStart(2,'0')}
  async function save(){
    if(!blob) return;
    var d=new Date();
    var name='capture-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+'.jpg';
    var isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    // iOS Safari often ignores the download attribute; the share sheet offers "Save Image"
    if(isIOS&&navigator.canShare&&window.File){
      try{
        var file=new File([blob],name,{type:'image/jpeg'});
        if(navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
      }catch(e){if(e&&e.name==='AbortError') return}
    }
    var a=document.createElement('a');
    a.href=blobUrl; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  $('open').addEventListener('click',openCamera);
  $('capture').addEventListener('click',capture);
  $('retake').addEventListener('click',retake);
  $('save').addEventListener('click',save);
  $('flip').addEventListener('click',function(){
    facing = facing==='environment' ? 'user' : 'environment'; openCamera();
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) stop();
    else if(!start.classList.contains('hidden')===false && preview.classList.contains('hidden')) openCamera();
  });
  layout();
})();
</script>
</body>
</html>
